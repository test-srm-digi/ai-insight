name: CBOM Scan
on: [push, pull_request]

permissions:
  contents: read

jobs:
  cbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CBOM Scanner
        uses: test-srm-digi/cbom-analyser@main
        with:
          scan-path: '.'
          output-format: 'json'

      - name: Upload CBOM Report
        uses: actions/upload-artifact@v4
        with:
          name: cbom-report
          path: cbom.json